name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # GitHub runs scheduled workflows from the default branch only.
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Restore the published forecast ledger
        run: node --use-system-ca scripts/restore-tracker.js
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
      - name: Generate community data snapshot and update the ledger
        run: npm run snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRACKER_PUBLICATION: github-pages
      - name: Back up the forecast ledger
        uses: actions/upload-artifact@v7
        with:
          name: forecast-ledger
          path: public/data/track-record.json
          retention-days: 90
          if-no-files-found: error
      - name: Set the GitHub Pages base path
        shell: bash
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          if [[ "${repo_name,,}" == "${GITHUB_REPOSITORY_OWNER,,}.github.io" ]]; then
            echo 'VITE_BASE=/' >> "$GITHUB_ENV"
          else
            echo "VITE_BASE=/${repo_name}/" >> "$GITHUB_ENV"
          fi
      - name: Build static site
        run: npm run build
        env:
          VITE_STATIC_FEED: 'true'
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
